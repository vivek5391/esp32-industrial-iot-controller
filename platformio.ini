; PlatformIO Project Configuration File
; ESP32 Industrial IoT Relay & Power Monitoring Controller
; https://github.com/vivek5391/esp32-industrial-iot-controller

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    blynkkk/Blynk @ ^1.3.2

build_flags =
    -D CORE_DEBUG_LEVEL=0
